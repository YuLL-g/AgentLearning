  <rect x="445" y="526" width="385" height="5" rx="2.5" fill="#ffc17b"/>
  <circle cx="498" cy="584" r="27" fill="#ffc17b" fill-opacity=".14" stroke="#ffc17b" stroke-opacity=".6" stroke-width="1.5"/>
  <text x="498" y="593" class="sans" text-anchor="middle" fill="#ffc17b" font-size="27" font-weight="760">?</text>
  <text x="476" y="659" class="mono" fill="#ffc17b" font-size="21" font-weight="750">01  ·  CLARIFY</text>
  <text x="801" y="593" class="sans" text-anchor="end" fill="#ffc17b" fill-opacity=".8" font-size="18" font-weight="650">第三方 Skill</text>
  <text x="476" y="704" class="sans" fill="#f7fbff" font-size="37" font-weight="750">Grill Me</text>
  <text x="476" y="750" class="sans" fill="#bbd0dc" font-size="22">反复追问，澄清要什么</text>

  
  <g filter="url(#card-shadow)">
    <rect x="870" y="526" width="385" height="272" rx="24" fill="#0d293d" stroke="#93bfff" stroke-opacity=".6" stroke-width="2"/>
