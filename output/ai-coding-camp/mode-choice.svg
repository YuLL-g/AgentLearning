  <text x="147" y="750" class="sans" fill="#bbd0dc" font-size="22">目录结构 + CLAUDE.md</text>

  
  <g filter="url(#card-shadow)">
    <rect x="445" y="526" width="385" height="272" rx="24" fill="#0d293d" stroke="#ffc17b" stroke-opacity=".6" stroke-width="2"/>
