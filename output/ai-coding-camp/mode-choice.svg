  <rect x="870" y="526" width="385" height="5" rx="2.5" fill="#93bfff"/>
  <circle cx="923" cy="584" r="27" fill="#93bfff" fill-opacity=".14" stroke="#93bfff" stroke-opacity=".6" stroke-width="1.5"/>
  <text x="923" y="593" class="sans" text-anchor="middle" fill="#93bfff" font-size="27" font-weight="760">≡</text>
  <text x="901" y="659" class="mono" fill="#93bfff" font-size="21" font-weight="750">02  ·  PLAN</text>
  <text x="1226" y="593" class="sans" text-anchor="end" fill="#93bfff" fill-opacity=".8" font-size="18" font-weight="650">Claude Code 模式</text>
  <text x="901" y="704" class="sans" fill="#f7fbff" font-size="37" font-weight="750">Plan 模式</text>
  <text x="901" y="750" class="sans" fill="#bbd0dc" font-size="22">形成可审阅的实施计划</text>

  
  <g filter="url(#card-shadow)">
    <rect x="1295" y="526" width="509" height="272" rx="24" fill="#0d293d" stroke="#72d2ff" stroke-opacity=".6" stroke-width="2"/>
  </g>
  <rect x="1295" y="526" width="509" height="5" rx="2.5" fill="#72d2ff"/>
  <circle cx="1348" cy="584" r="27" fill="#72d2ff" fill-opacity=".14" stroke="#72d2ff" stroke-opacity=".6" stroke-width="1.5"/>
  <text x="1348" y="593" class="sans" text-anchor="middle" fill="#72d2ff" font-size="27" font-weight="760">✓</text>
  <text x="1326" y="659" class="mono" fill="#72d2ff" font-size="21" font-weight="750">03  ·  BUILD</text>
  <text x="1775" y="593" class="sans" text-anchor="end" fill="#72d2ff" fill-opacity=".8" font-size="18" font-weight="650">开发流程</text>
  <text x="1326" y="704" class="sans" fill="#f7fbff" font-size="37" font-weight="750">TDD</text>
  <text x="1326" y="750" class="sans" fill="#bbd0dc" font-size="22">测试先行，小步实现与验证</text>


